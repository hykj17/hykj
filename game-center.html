<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏中心</title>
  <style>
    :root{
      --bg:#050608;
      --line:rgba(255,255,255,.08);
      --txt:#e8edf4;
      --muted:#8b97a8;
      --cyan:#ffffff;
      --glow:0 0 40px rgba(255,255,255,.25);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6;
    }
    a{color:inherit;text-decoration:none}
    ::selection{background:#fff;color:#000}

    /* 背景：纯黑 + 白色三角形 */
    #bg-canvas{position:fixed;inset:0;z-index:0;opacity:.55}
    .bg-grad{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(1100px 800px at 50% -5%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(900px 700px at 50% 115%, rgba(255,255,255,.03), transparent 60%);
    }
    .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 24px}

    header{
      position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
      background:rgba(5,6,8,.55);border-bottom:1px solid var(--line);
    }
    .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;font-size:20px}
    .logo .dot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);animation:pulse 2.4s infinite}
    .logo-img{height:34px;width:34px;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
    .btn{
      display:inline-block;padding:9px 24px;border-radius:30px;font-size:13.5px;font-weight:500;
      letter-spacing:1.5px;text-indent:1.5px;color:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.85);cursor:pointer;
      background:rgba(255,255,255,.03);
      box-shadow:0 0 0 .5px rgba(255,255,255,.22), inset 0 0 14px rgba(255,255,255,.045);
      transition:all .32s cubic-bezier(.4,0,.2,1);
    }
    .btn:hover{
      background:#fff;color:#000;border-color:#fff;letter-spacing:2.5px;
      box-shadow:0 0 26px rgba(255,255,255,.3), 0 0 0 .5px rgba(255,255,255,.6);
    }
    .btn.solid{background:#fff;border:none;color:#000;box-shadow:none}
    .btn.solid:hover{box-shadow:0 0 26px rgba(255,255,255,.45)}

    .hero{padding:120px 0 70px;text-align:center}
    .hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:2px}
    .hero p{color:var(--muted);margin:18px auto 0;max-width:560px}

    .games{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:90px}
    .game{
      border:1px solid var(--line);border-radius:20px;padding:26px;background:rgba(255,255,255,.02);
      transition:.25s;position:relative;overflow:hidden;
    }
    .game::before{
      content:"";position:absolute;inset:0;border-radius:20px;padding:1px;
      background:linear-gradient(120deg,transparent,transparent);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s;
      pointer-events:none;   /* 装饰层不可拦截点击，否则按钮点不动 */
    }
    .game:hover{transform:translateY(-4px);background:rgba(255,255,255,.05)}
    .game h3{font-size:20px;margin-bottom:10px}
    .game p{color:var(--muted);font-size:14px;margin-bottom:18px;min-height:42px}
    .tag-dev{display:inline-block;font-size:12px;letter-spacing:2px;color:#fff;opacity:.6;margin-bottom:14px;border:1px solid var(--line);padding:3px 10px;border-radius:20px}
    .game-video{
      display:block;width:calc(100% + 52px);margin:-26px -26px 18px;
      aspect-ratio:1716/1268;object-fit:cover;border-bottom:1px solid var(--line);
      pointer-events:none;
    }

    footer{border-top:1px solid var(--line);padding:40px 0;color:var(--muted);font-size:14px;text-align:center}

    /* ===== 进入过渡：从中间开始清晰，慢慢向外展开 ===== */
    #page{animation:irisIn 1s cubic-bezier(.3,.6,.3,1) both}
    @keyframes irisIn{
      from{clip-path:circle(0% at 50% 45%);opacity:.5}
      to{clip-path:circle(142% at 50% 45%);opacity:1}
    }
    /* 离开过渡：向中间收拢 */
    body.page-leave #page{animation:leaveCenter .7s ease-in forwards}
    @keyframes leaveCenter{to{opacity:0;transform:scale(.88);filter:blur(8px)}}
    body.page-leave #bg-canvas{opacity:0;transition:opacity .7s}

    @media(max-width:820px){.games{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grad"></div>

  <div id="page">
  <header>
    <div class="wrap nav">
      <div class="logo"><img class="logo-img" src="hy-logo.png" alt="鹤羽科技">游戏中心</div>
      <a href="index.html" class="btn">返回首页</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>游戏中心</h1>
      <p>收录我们自己开发的小游戏，欢迎游玩。</p>
    </section>

    <section class="games">
      <div class="game reveal">
        <video class="game-video" src="zhuyi-preview.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="tag-dev">自研</div>
        <h3>主义</h3>
        <p>六角网格策略对战，支持 PC、移动与 3D 多版本，含 AI 战术与叛乱势力系统。</p>
        <a href="game.html" class="btn solid">开始游戏</a>
      </div>
      <div class="game reveal">
        <div class="tag-dev">自研</div>
        <h3>新游戏占位</h3>
        <p>在这里放你们正在开发的新作品简介，点击即可进入游玩。</p>
        <a href="#" class="btn">敬请期待</a>
      </div>
      <div class="game reveal">
        <div class="tag-dev">自研</div>
        <h3>新游戏占位</h3>
        <p>第三个自研项目位，自由替换标题、文案与链接即可。</p>
        <a href="#" class="btn">敬请期待</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">© 鹤羽科技 · 游戏中心</div>
  </footer>
  </div>

  <script>
    // 返回首页：先播放"向中间收拢"过渡，再在当前窗口/iframe 内导航
    function goHome(e){
      if(e) e.preventDefault();
      document.body.classList.add('page-leave');
      setTimeout(() => { location.href = 'index.html'; }, 700);
    }
    document.querySelectorAll('a[href="index.html"]').forEach(a => a.addEventListener('click', goHome));

    // 开始游戏：直接由 <a href="game.html"> 在当前窗口/iframe 内导航，
    // 不再依赖 window.open（iframe 下会被浏览器拦截弹窗，导致点不动）。
    // 背景白色三角形（与首页一致：鼠标下移视差 + 缓慢下沉旋转）
    const cv = document.getElementById('bg-canvas');
    const ctx = cv.getContext('2d');
    let w, h, pts;
    function resize(){
      w = cv.width = innerWidth; h = cv.height = innerHeight;
      const n = Math.min(60, Math.floor(w*h/26000));
      pts = Array.from({length:n}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        size: 6 + Math.random()*22,
        rot: Math.random()*Math.PI,
        vrot: (Math.random()-.5)*0.004,
        depth: 0.3 + Math.random()*0.9,
        vy: 0.12 + Math.random()*0.25
      }));
    }
    let mouseX = innerWidth/2, mouseY = innerHeight/2, smX = mouseX, smY = mouseY;
    addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    addEventListener('touchmove', e => { if(e.touches[0]){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; } }, {passive:true});
    function drawTri(x,y,s,r,a){
      ctx.save(); ctx.translate(x,y); ctx.rotate(r);
      ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.87,s*0.5); ctx.lineTo(-s*0.87,s*0.5); ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,'+a+')'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
    }
    function draw(){
      smX += (mouseX-smX)*0.06; smY += (mouseY-smY)*0.06;
      const dy = (smY - innerHeight/2);
      ctx.clearRect(0,0,w,h);
      for(const t of pts){
        t.y += t.vy; t.rot += t.vrot;
        if(t.y > h+30){ t.y = -30; t.x = Math.random()*w; }
        const py = t.y - dy * t.depth * 0.5;
        const a = 0.10 + t.depth*0.22;
        drawTri(t.x, py, t.size, t.rot, a);
      }
      requestAnimationFrame(draw);
    }
    resize(); draw(); addEventListener('resize', resize);

    // 滚动揭示
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.15});
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
</body>
</html>
