<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全球节点</title>
<style>
  :root{
    --bg:#050608;
    --line:rgba(255,255,255,.10);
    --txt:#e8edf4;
    --muted:#9aa3b0;
    --glow:0 0 40px rgba(255,255,255,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:#fff;color:#000}

  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.45;transition:opacity .8s ease}
  .bg-grad{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 800px at 50% -5%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(900px 700px at 50% 115%, rgba(255,255,255,.03), transparent 60%);
  }
  .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 24px}

  header{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:rgba(5,6,8,.55);border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;font-size:20px}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);animation:pulse 2.4s infinite}
  .logo-img{height:34px;width:34px;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  .btn{
    display:inline-block;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:600;
    border:1px solid #fff;color:#fff;transition:.25s;cursor:pointer;background:transparent;
  }
  .btn:hover{background:#fff;color:#000;box-shadow:0 0 30px rgba(255,255,255,.35)}

  /* 离开：向中间收拢 */
  body.page-leave header, body.page-leave .bottom-ui, body.page-leave .sec-head, body.page-leave .zoom-ctl{opacity:0 !important;transition:opacity .6s ease}
  body.page-leave #globe{opacity:0 !important}

  /* 地球画布：全屏无边框，放大不再有方形裁切 */
  /* canvas 是替换元素，inset:0 不会自动拉伸，必须显式 100% 宽高 */
  #globe{position:fixed;inset:0;width:100%;height:100%;z-index:1;cursor:grab;touch-action:none;opacity:0;transition:opacity .9s ease}
  #globe.on{opacity:1}
  #globe:active{cursor:grabbing}

  .sec-head{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:5;
    text-align:center;width:min(90vw,640px);pointer-events:none;
    opacity:0;animation:fadeIn .8s ease 2.5s forwards;
  }
  .sec-head .tag{color:rgba(255,255,255,.6);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .sec-head h2{font-size:clamp(22px,3vw,32px);font-weight:800;margin:8px 0 10px}
  .sec-head p{color:var(--muted);font-size:13px}
  /* 矮窗口：隐藏描述与提示，避免挤压地球 */
  @media (max-height:620px){
    .sec-head p{display:none}
    .sec-head h2{margin:4px 0 6px}
    .pin-hint{display:none}
  }

  .zoom-ctl{
    position:fixed;right:22px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:8px;z-index:10;
    opacity:0;animation:fadeIn .8s ease 2.7s forwards;
  }
  .zoom-ctl button{
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
    background:rgba(5,6,8,.55);color:#fff;font-size:16px;cursor:pointer;transition:.2s;
    display:grid;place-items:center;padding:0;line-height:1;
  }
  .zoom-ctl button:hover{background:#fff;color:#000}
  .zoom-ctl #z-reset{font-size:11px;letter-spacing:.5px}

  .bottom-ui{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    pointer-events:none;width:max-content;max-width:94vw;
    opacity:0;animation:fadeIn .8s ease 2.9s forwards;
  }
  .visitor-info{
    font-size:14px;color:rgba(255,255,255,.8);letter-spacing:1px;
    display:inline-block;border:1px solid var(--line);border-radius:20px;padding:7px 18px;
    background:rgba(5,6,8,.5);
  }
  .legend{
    display:flex;gap:26px;justify-content:center;flex-wrap:wrap;
    color:var(--muted);font-size:14px;
  }
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .legend i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
  .dot-grid{width:10px;height:10px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,.5)}
  .ring{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
  .pin-hint{font-size:13px;color:var(--muted);letter-spacing:1px}

  @keyframes fadeIn{to{opacity:1}}

  /* 页面不滚动，地球即页面 */
  body{overflow:hidden}
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grad"></div>
  <canvas id="globe"></canvas>

  <header>
    <div class="wrap nav">
      <div class="logo"><img class="logo-img" src="hy-logo.png" alt="鹤羽科技">鹤羽科技</div>
      <a href="index.html" class="btn" id="back-home">← 返回首页</a>
    </div>
  </header>

  <div class="sec-head">
    <div class="tag">Global Nodes</div>
    <h2>全球节点</h2>
    <p>真实地球地形，每一位访客的位置都会被记录在这颗星球上。拖动旋转，滚轮放大查看细节。</p>
  </div>

  <div class="zoom-ctl">
    <button id="z-in" title="放大">＋</button>
    <button id="z-out" title="缩小">－</button>
    <button id="z-reset" title="重置缩放">1×</button>
  </div>

  <div class="bottom-ui">
    <div class="visitor-info" id="visitor-info">正在定位…</div>
    <div class="legend">
      <span><i></i> 你/访客的位置</span>
      <span><span class="dot-grid"></span> 陆地地形</span>
      <span><span class="ring"></span> 经纬网格</span>
    </div>
    <div class="pin-hint">拖动旋转 · 滚轮 / ＋－ 缩放</div>
  </div>

<!-- 云服务 SDK（访客位置云端存储） -->
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
  const cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: 'https://my-website-36784.app.workbuddy.host',
    publishableKey: 'wbpk_VmfarAlKRQt9zlldhQSClv_S9mSLBdiJ769crSYnUMF0f70mdWjkVRX',
  });
  window.__CLOUD__ = {
    async addVisitor(v){
      const { error } = await cloud.database.from('visitors')
        .insert({ lat: v.lat, lon: v.lon, city: v.city || null });
      if(error) throw error;
    },
    async getVisitors(){
      const { data, error } = await cloud.database.from('visitors')
        .select('lat, lon, city')
        .order('created_at', { ascending: false })
        .limit(500);
      if(error) throw error;
      return (data || []).map(r => ({ lat: r.lat, lon: r.lon, city: r.city || '' }));
    }
  };
</script>

<script>
  // ===== 白色三角形背景（随鼠标下移而移动） =====
  const bcv = document.getElementById('bg-canvas');
  const bctx = bcv.getContext('2d');
  let bw, bh, tris = [];
  let mouseX = bw/2||0, mouseY = 0, smX = 0, smY = 0;
  let clickDots = [];
  function bresize(){
    bw = bcv.width = innerWidth; bh = bcv.height = innerHeight;
    const n = Math.max(28, Math.min(80, Math.floor(bw*bh/24000)));
    tris = [];
    for(let i=0;i<n;i++){
      const depth = 0.25 + Math.random()*0.95;
      tris.push({ bx:Math.random()*bw, by:Math.random()*bh, size:7+Math.random()*38,
        rot:Math.random()*Math.PI*2, vrot:(Math.random()-.5)*0.005, driftY:Math.random()*0.25+0.05,
        depth, alpha:0.08+depth*0.55 });
    }
  }
  function bdrawTri(x,y,s,r,a){
    bctx.save();bctx.translate(x,y);bctx.rotate(r);bctx.beginPath();
    for(let i=0;i<3;i++){const ang=-Math.PI/2+i*(Math.PI*2/3);i===0?bctx.moveTo(Math.cos(ang)*s,Math.sin(ang)*s):bctx.lineTo(Math.cos(ang)*s,Math.sin(ang)*s);}
    bctx.closePath();bctx.fillStyle='rgba(255,255,255,'+a+')';bctx.fill();bctx.restore();
  }
  // 背景三角形：正常漂移（整体透明度由入场镜头控制）
  function bdraw(now){
    now = now || performance.now();
    bctx.clearRect(0,0,bw,bh);
    smX+=(mouseX-smX)*0.06;smY+=(mouseY-smY)*0.06;
    const mx=smX-bw/2,my=smY-bh/2;
    for(const t of tris){
      t.rot+=t.vrot;t.by+=t.driftY;if(t.by>bh+60)t.by=-60;
      const x=t.bx+mx*t.depth*0.05, y=t.by+my*t.depth*0.10;
      bdrawTri(x,y,t.size,t.rot,t.alpha);
    }
    for(let i=clickDots.length-1;i>=0;i--){
      const d=clickDots[i];d.t++;d.x+=d.vx;d.y+=d.vy;
      const fin=Math.min(Math.max(d.t-d.delay,0)/(d.life*0.3),1);
      const fout=Math.min((d.life-d.t)/(d.life*0.5),1);
      const a=Math.max(0,fin)*Math.max(0,fout)*0.9;
      if(d.t>=d.life){clickDots.splice(i,1);continue;}
      bctx.beginPath();bctx.arc(d.x,d.y,d.r,0,Math.PI*2);bctx.fillStyle='rgba(255,255,255,'+a+')';bctx.fill();
    }
    requestAnimationFrame(bdraw);
  }

  // ===== 入场：视角贴着地形(放大态)往后移，周围三角形慢慢显现，最后收成完整地球 =====
  let camIntro = null;   // {t0, Z0}
  function startIntro(){
    const Z0 = 4.2;
    setZoom(Z0);
    camIntro = { t0: performance.now(), Z0 };
    cv.classList.add('on');                 // 地球立即淡入（开场就是贴脸地形）
    bcv.style.transition = 'none';
    bcv.style.opacity = '0';                // 三角形从无到有，随后拉慢慢显现
  }
  // 每帧更新镜头（由 drawGlobe 调用）
  function updateCamera(){
    if(!camIntro) return;
    const now = performance.now();
    const DUR = 2600;
    const t = (now - camIntro.t0)/DUR;
    // 周围三角形慢慢显现（0 → 0.45，跟随后拉）
    bcv.style.opacity = String(Math.min(1, Math.max(0, t*1.15))*0.45);
    if(t >= 1){
      setZoom(1); camIntro = null;
      bcv.style.opacity = '.45';
      bcv.style.transition = '';            // 恢复 CSS 过渡
      return;
    }
    const e = 1 - Math.pow(1-t, 3);         // easeOutCubic：先快后稳地后退
    setZoom(camIntro.Z0 + (1 - camIntro.Z0)*e);
  }
  function spawnClickDots(cx,cy){
    const rings=[{r:4,n:12,delay:0},{r:9,n:18,delay:2},{r:14,n:24,delay:4},{r:19,n:30,delay:6},{r:24,n:36,delay:8}];
    rings.forEach((ring,ri)=>{for(let k=0;k<ring.n;k++){const ang=(k/ring.n)*Math.PI*2+ri*0.12;
      clickDots.push({x:cx+Math.cos(ang)*ring.r,y:cy+Math.sin(ang)*ring.r,vx:Math.cos(ang)*0.14,vy:Math.sin(ang)*0.14,
        r:1.4,t:0,delay:ring.delay,life:80+ri*35});}});
  }
  addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});
  addEventListener('touchmove',e=>{if(e.touches[0]){mouseX=e.touches[0].clientX;mouseY=e.touches[0].clientY;}},{passive:true});
  addEventListener('click',e=>spawnClickDots(e.clientX,e.clientY));
  addEventListener('touchstart',e=>{if(e.touches[0])spawnClickDots(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  bresize();bdraw();addEventListener('resize',bresize);

  const LON_N = 720, LAT_N = 360;
  const landPts = (function(){

  function drawVisitorDots(){

    for(const b of visitorBases){
      // 该访客位置附近已有命名节点时，节点负责标注，避免「杭州」与「Hangzhou」叠字
      const nearNode = b.lat!=null && nodeNear(b.lat, b.lon);
      const x1 = b.x*cosY + b.z*sinY;
      const z1 = -b.x*sinY + b.z*cosY;
      const y2 = b.y*cosT - z1*sinT;

  function gresize(){

    const headEl = document.querySelector('.sec-head');

    const gbr = el => (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
    const hr = gbr(headEl), fr = gbr(footEl);
    const headB = ((hr ? hr.bottom : H*0.25) + 20) * dpr;

    // 0.5° 掩码点较多，按点数跳绘以保帧率；点径随缩放略增
    const stride = landPts.length > 50000 ? 2 : 1;
    const dsB = (1.2 + Math.min(zoom,3)*0.25)*dpr, dsD = (1.0 + Math.min(zoom,3)*0.2)*dpr;
    // 近正面更亮的一层
    ctx.fillStyle='rgba(255,255,255,.62)';
    for(let i=0;i<landPts.length;i+=stride){
      const b=landPts[i];
      const x1=b.x*cosY+b.z*sinY, z1=-b.x*sinY+b.z*cosY;
      const y2=b.y*cosT-z1*sinT, z2=b.y*sinT+z1*cosT;
      if(z2<=0.4) continue;
      ctx.fillRect(cx+x1*R, cy-y2*R, dsB, dsB);
    }
    // 远正面（边缘）较暗的一层
    ctx.fillStyle='rgba(255,255,255,.28)';
    for(let i=0;i<landPts.length;i+=stride){
      const b=landPts[i];
      const x1=b.x*cosY+b.z*sinY, z1=-b.x*sinY+b.z*cosY;
      const y2=b.y*cosT-z1*sinT, z2=b.y*sinT+z1*cosT;
      if(z2<=0.02 || z2>0.4) continue;
      ctx.fillRect(cx+x1*R, cy-y2*R, dsD, dsD);
    }

    // 纬线（放大时加密到 7.5° 以呈现更多细节）
    const latStep = zoom>2.2 ? 7.5 : 15;
    for(let lat=-75; lat<=75; lat+=latStep){
      let first=true;
      ctx.beginPath();
      for(let lon=0; lon<=360; lon+=4){
        const p = project(lat,lon);
        const px = cx + p.x*R, py = cy - p.y*R;
        if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.lineWidth = 1*dpr;
      ctx.stroke();
    }
    // 经线（放大时加密）
    const lonStep = zoom>2.2 ? 7.5 : 15;
    for(let lon=0; lon<360; lon+=lonStep){
      let first=true;
      ctx.beginPath();
      for(let lat=-90; lat<=90; lat+=4){
        const p = project(lat,lon);
        const px = cx + p.x*R, py = cy - p.y*R;
        if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = 'rgba(255,255,255,.10)';
      ctx.lineWidth = 1*dpr;
      ctx.stroke();
    }

    // 节点光点（杭州）
    const t = performance.now()/1000;
    drawVisitorDots();
    NODES.forEach(node=>{
      const p = project(node.lat, node.lon);
      if(p.z <= 0.02) return;             // 背面不显示
      const px = cx + p.x*R, py = cy - p.y*R;
      const fade = Math.min(1, (p.z)*2.2); // 边缘淡出
      // 脉冲圈
      const pulse = 1 + (Math.sin(t*2.2)+1)/2 * 0.8;
      ctx.beginPath();ctx.arc(px,py, 9*dpr*pulse, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.35*fade)+')';
      ctx.lineWidth = 1.5*dpr; ctx.stroke();
      // 实心光点 + 光晕
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,.9)';
      ctx.shadowBlur = 16*dpr;
      ctx.beginPath();ctx.arc(px,py, 4*dpr, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,'+fade+')';ctx.fill();
      ctx.restore();
      // 标注
      ctx.font = (14*dpr)+'px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,'+fade+')';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(node.name, px + 12*dpr, py);
    });

    // 螺旋自转：绕Y持续旋转，同时视角从顶部缓慢扫到底部，形成螺旋下探
    if(autoSpin){
      rotY += 0.0028;
      if(!camIntro){
        spinPhase += 0.012;
        tilt = -0.45 + 0.1 * Math.sin(spinPhase); // 轻微摆动（±0.1rad≈±6°），不再大幅点头晃脑
      }
    }
    requestAnimationFrame(drawGlobe);
  }

  // 鼠标/触摸拖拽旋转
  let dragging=false, lastX=0, lastY=0;
  cv.addEventListener('mousedown', e=>{dragging=true;autoSpin=false;lastX=e.clientX;lastY=e.clientY;});
  addEventListener('mouseup', ()=>dragging=false);
  addEventListener('mousemove', e=>{
    if(!dragging) return;
    rotY += (e.clientX-lastX)*0.01;
    tilt += (e.clientY-lastY)*0.01;
    tilt = Math.max(-1.3, Math.min(1.3, tilt));
    lastX=e.clientX;lastY=e.clientY;
  });
  cv.addEventListener('touchstart', e=>{dragging=true;autoSpin=false;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;},{passive:true});
  cv.addEventListener('touchend', ()=>dragging=false);
  cv.addEventListener('touchmove', e=>{
    if(!dragging) return;
    const tx=e.touches[0].clientX, ty=e.touches[0].clientY;
    rotY += (tx-lastX)*0.01; tilt += (ty-lastY)*0.01;
    tilt = Math.max(-1.3, Math.min(1.3, tilt));
    lastX=tx;lastY=ty;
  },{passive:true});
  // 停止拖拽后恢复自转
  setInterval(()=>{ if(!dragging) autoSpin=true; }, 2500);

  // ===== 缩放控制：按钮 + 滚轮 + 双指 =====
  const zIn = document.getElementById('z-in');
  const zOut = document.getElementById('z-out');
  const zReset = document.getElementById('z-reset');
  if(zIn) zIn.addEventListener('click', ()=>setZoom(zoom*1.3));
  if(zOut) zOut.addEventListener('click', ()=>setZoom(zoom/1.3));
  if(zReset) zReset.addEventListener('click', ()=>setZoom(1));
  cv.addEventListener('wheel', e=>{ e.preventDefault(); if(camIntro) return; setZoom(zoom*(e.deltaY<0 ? 1.15 : 1/1.15)); }, {passive:false});
  let pinchDist = 0;
  cv.addEventListener('touchstart', e=>{ if(e.touches.length===2){ pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); } }, {passive:true});
  cv.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinchDist){ if(camIntro) return; const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); setZoom(zoom*(d/pinchDist)); pinchDist = d; } }, {passive:true});
  cv.addEventListener('touchend', ()=>{ pinchDist = 0; });

  gresize(); drawGlobe(); addEventListener('resize', gresize);

  // ===== 入场：背景三角形汇聚拼出地球 =====
  startIntro();

  // ===== 返回首页：先收拢过渡，再跳转 =====
  document.getElementById('back-home').addEventListener('click', e=>{
    e.preventDefault();
    document.body.classList.add('page-leave');
    setTimeout(()=>{ location.href='index.html'; }, 700);
  });

  // ===== 访客定位与记录 =====
  const vInfo = document.getElementById('visitor-info');
  function setInfo(txt){ if(vInfo) vInfo.textContent = txt; }

  // IP 粗定位（无需授权，城市级）
  async function ipLoc(){
    try{
      const r = await fetch('https://ipwho.is/');
      const j = await r.json();
      if(j && j.latitude) return { lat:j.latitude, lon:j.longitude, city:j.city || j.country || '' };
    }catch(e){}
    return null;
  }
  // 浏览器精确定位（需授权）
  function gpsLoc(){
    return new Promise(res=>{
      if(!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p=>res({ lat:p.coords.latitude, lon:p.coords.longitude, city:'你' }),
        ()=>res(null),
        { timeout:4000, maximumAge:600000 }
      );
    });
  }
  function dedupe(list){
    const seen = new Set(), out = [];
    for(const v of list){
      const k = v.lat.toFixed(1)+','+v.lon.toFixed(1);
      if(seen.has(k)) continue;
      seen.add(k); out.push(v);
    }
    return out;
  }
  (async function initVisitor(){
    let loc = await gpsLoc();
    if(!loc) loc = await ipLoc();

    let others = [];
    if(window.__CLOUD__ && window.__CLOUD__.getVisitors){
      try{ others = await window.__CLOUD__.getVisitors() || []; }catch(e){ others = []; }
    }

    if(loc){
      VISITORS = dedupe([Object.assign({current:true}, loc)].concat(others));
      refreshVisitorBases();
      setInfo('你的位置已标记' + (loc.city ? ' · '+loc.city : '') + ' · 累计 ' + VISITORS.length + ' 位访客');
      if(window.__CLOUD__ && window.__CLOUD__.addVisitor){
        const rec = { lat: loc.lat, lon: loc.lon, city: (loc.city && loc.city !== '你') ? loc.city : null };
        window.__CLOUD__.addVisitor(rec).catch(()=>{});
      }
    } else if(others.length){
      VISITORS = dedupe(others); refreshVisitorBases();
      setInfo('累计 ' + VISITORS.length + ' 位访客');
    } else {
      setInfo('未能获取位置');
    }
  })();
</script>
</body>
</html>
